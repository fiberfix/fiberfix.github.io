<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Blue metallic gradient for left F -->
    <linearGradient id="blueGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#1a2f80"/>
      <stop offset="30%"  stop-color="#1e3faa"/>
      <stop offset="55%"  stop-color="#2952cc"/>
      <stop offset="75%"  stop-color="#1a3090"/>
      <stop offset="100%" stop-color="#0d1a55"/>
    </linearGradient>
    <!-- Blue highlight sheen -->
    <linearGradient id="blueSheen" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%"   stop-color="#4060d0" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#6080e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3050b8" stop-opacity="0"/>
    </linearGradient>

    <!-- Silver/chrome gradient for right F -->
    <linearGradient id="silverGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#5a6a7a"/>
      <stop offset="20%"  stop-color="#8fa0b8"/>
      <stop offset="45%"  stop-color="#d8e2ef"/>
      <stop offset="60%"  stop-color="#ffffff"/>
      <stop offset="75%"  stop-color="#9aafc8"/>
      <stop offset="100%" stop-color="#4a5a70"/>
    </linearGradient>
    <!-- Silver highlight sheen -->
    <linearGradient id="silverSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="65%"  stop-color="#c0d0e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for blue F -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2040bb" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shadow for depth -->
    <filter id="depthShadow">
      <feDropShadow dx="-3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Pure black background -->
  <rect width="200" height="200" fill="#000000"/>

  <!--
    FF logo: two bold italic F letters overlapping
    Left F: blue metallic (slightly larger, behind)
    Right F: silver chrome (in front, offset right)

    The F shape (italic ~15deg skew):
      - Vertical stem
      - Top horizontal bar
      - Mid horizontal bar (shorter)
  -->

  <!-- ===== LEFT F (Blue) — slightly behind, larger ===== -->
  <g filter="url(#blueGlow)" transform="translate(38, 32)">
    <!-- Skew/italic transform: skewX(-14) -->
    <g transform="skewX(-14)">
      <!-- Vertical stem -->
      <rect x="0" y="0" width="22" height="108" rx="2" fill="url(#blueGrad)"/>
      <!-- Top bar -->
      <rect x="0" y="0" width="76" height="22" rx="2" fill="url(#blueGrad)"/>
      <!-- Mid bar -->
      <rect x="0" y="40" width="58" height="20" rx="2" fill="url(#blueGrad)"/>
      <!-- Sheen overlay -->
      <rect x="0" y="0" width="76" height="108" rx="2" fill="url(#blueSheen)"/>
    </g>
  </g>

  <!-- ===== RIGHT F (Silver/Chrome) — in front, offset ===== -->
  <g filter="url(#depthShadow)" transform="translate(84, 40)">
    <g transform="skewX(-14)">
      <!-- Vertical stem -->
      <rect x="0" y="0" width="20" height="100" rx="2" fill="url(#silverGrad)"/>
      <!-- Top bar -->
      <rect x="0" y="0" width="68" height="20" rx="2" fill="url(#silverGrad)"/>
      <!-- Mid bar -->
      <rect x="0" y="37" width="52" height="18" rx="2" fill="url(#silverGrad)"/>
      <!-- Sheen overlay -->
      <rect x="0" y="0" width="68" height="100" rx="2" fill="url(#silverSheen)"/>
    </g>
  </g>
</svg>
